set -sg terminal-overrides ",*:RGB"
set -g escape-time 0
set -g mouse on
set -g renumber-windows on
set -g repeat-time 1000

set -g base-index 1
set -g pane-base-index 1

setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

unbind r
bind r source-file ~/.tmux.conf

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

unbind v
unbind s
bind s split-window -v
bind v split-window -h

unbind q
bind q kill-pane

set -g status-position top
set -g status-justify absolute-centre
set -g status-interval 1

set -g status-style bg="#201f35",fg="#1d1c31"

set -g message-style bg="#201f35",fg="#eab575"
set -g message-command-style bg="#201f35",fg="#eab575"

set -g window-status-current-style bg="#201f35",fg="#eab575",bold
set -g window-status-current-format " #I:#W "

set -g window-status-style bg="#201f35",fg="#8A89a6"
set -g window-status-format " #I:#W "

set -g pane-border-style fg="#1d1c31"
set -g pane-active-border-style fg="#eab575"
set -g pane-border-lines heavy

set -g mode-style bg="#EAB575",fg="#201F35"
